# Everything recall needs, on one machine, with no account anywhere.
#
# The embedding server downloads its weights on first start, so there is
# nothing to fetch by hand. Expect the first `up` to take a while and later
# ones to be instant.
#
# This brings up what recall needs to INDEX and SEARCH: a database and an
# embedding server. Writing prose answers is optional and uses whatever
# OpenAI-compatible endpoint you already run, so no chat model is bundled
# here. Point RECALL_CHAT_URL at yours. See docs/answering.md.
#
# MEMORY, if you do run a generation model alongside this: weights on a
# unified-memory machine come out of the SAME pool as everything else and do
# not appear in a process's RSS, so two resident models can push a box into
# the OOM killer. It then kills a model server mid-request, and the client
# sees an HTTP 502 that looks exactly like "this input was bad".

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall
    ports: ["5433:5432"]
    volumes: ["recall-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -hf ${RECALL_EMBED_HF:-Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0}
      --host 0.0.0.0 --port 8080
      --embedding --pooling last
      -c 8192 -b 8192 -ub 8192
      --metrics
    ports: ["8080:8080"]
    volumes: ["recall-models:/root/.cache/llama.cpp"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    restart: unless-stopped
    # For an NVIDIA GPU, uncomment. Without it this runs on CPU, which works
    # but embeds far more slowly.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes:
  recall-db:
  recall-models:
