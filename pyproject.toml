[project]
name = "recall"
version = "0.1.0"
description = "Ask questions about your own archive, entirely on your machine"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recall = "recall.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
